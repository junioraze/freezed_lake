name: "insert_raw_replay_logs"
description: "Extract data from showdown.com and parse to raw.replay_logs"
schedule: ""

# infra env variables
dotenv: "/dags/.env.global"

params:
  - name: NAME_SPACE
    type: string
    default: raw
  - name: TABLE_NAME
    type: string
    default: replay_logs
  - name: RANGE
    type: integer
    default: 100

steps:
  - name: run-insert_raw_replay_logs
    container:
      # worker config
      image: obamasnow-scraper:latest
      network: lakehouse_net
      # script variable
      env:
        # job variables
        - NAME_SPACE=${params.NAME_SPACE}
        - TABLE_NAME=${params.TABLE_NAME}
        - RANGE=${params.RANGE}
        # env variables
        - POLARIS_ENDPOINT=${env.POLARIS_ENDPOINT}
        - POLARIS_REALM=${env.POLARIS_REALM}
        - POLARIS_USER=${env.POLARIS_USER}
        - POLARIS_PASS=${env.POLARIS_PASS}
        - MINIO_ENDPOINT=${env.MINIO_ENDPOINT}
        - MINIO_USER=${env.MINIO_USER}
        - MINIO_PASS=${env.MINIO_PASS}
        - CATALOG_BUCKET=${env.CATALOG_BUCKET}
    # python entrypoint direct to script
    run: workers/insert/raw_replay_logs.py